<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Các sự kiện
    </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>=
<div id="loadingScreen">
    <div class="loading-text">
        Đang tải ảnh... (0/30)
    </div> 
    <img src="../img/funcbut/loading.png" class="spinner"> 
</div>
<div class="bg-layer bg1"></div>
<div class="bg-layer bg2"></div>
<div class="bg-layer bg3"></div>
<div class="bg-layer bg4"></div>

<div class="gallery"></div>

<div class="overlay">

    <button class="close-btn"><img src="../img/funcbut/back_bl.png" alt="back"></button>

    <div class="viewer-frame">
        <img id="viewerImage">
    </div>

    <div class="info-box">
        <h2 id="viewerTitle"></h2>
        <div id="viewerDate"></div>
        <p id="viewerInfo"></p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
